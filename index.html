<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Coffee Shop</title>

    <!-- font awesome cdn -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- google font : "Varela Round" -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap"
      rel="stylesheet"
    />

    <!-- external-css -->
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <header>
      <!-- navbar starts -->
      <nav class="">
        <div class="nav-container container">
          <div class="brand-logo">
            <img src="./image/nav-logo.png" alt="" />
          </div>
          <div class="menu-items-container">
            <ul class="menu-items">
              <li><a href="">Home</a></li>
              <li><a href="">About</a></li>
              <li><a href="">Menu</a></li>
              <li><a href="">Contact</a></li>
            </ul>
          </div>
        </div>
      </nav>
      <!-- navbar ends -->

      <!-- hero/banner section starts -->
      <section id="banner-container">
        <div class="banner-content">
          <p class="text-yellow banner-top-text">freshly roasted , daily</p>
          <h1 class="banner-heading">
            your perfect cup of coffee <br />
            starts here
          </h1>
          <p class="banner-desc">
            Handcrafted coffee to make your everyday mornings a little more
            special.
          </p>
          <button class="btn">buy now</button>
        </div>
      </section>
      <!-- hero/banner section ends -->
    </header>
  </body>
</html>
